name: Build standalone toolkit
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0
      - run: python test_editor.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name EvolandToolkit --add-data "catalog.json;." --add-data "patch_manifest.json;." editor.py
      - name: Smoke test standalone executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\EvolandToolkit.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: EvolandToolkit-Windows-x86_64
          path: dist/EvolandToolkit.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv xvfb libxss1 libxft2
      - run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install pyinstaller==6.16.0
          python test_editor.py
      - name: Build AppImage and portable archive
        run: |
          . .venv/bin/activate
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" bash packaging/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EvolandToolkit-Linux-x86_64
          path: release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
